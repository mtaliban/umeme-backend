name: Deploy Backend → EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umeme-backend

jobs:
  # ── CI: Build & push Docker image ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD: Deploy to EC2 via SSH ───────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE_TAG,GH_OWNER
          script: |
            set -e

            # Login to GHCR
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Clone or pull latest code
            if [ -d /opt/company-website/.git ]; then
              cd /opt/company-website && git pull origin main
            else
              git clone https://$GH_ACTOR:$GH_TOKEN@github.com/$GH_OWNER/umeme-backend.git /opt/company-website
              cd /opt/company-website
            fi

            # Pull new image and restart backend + caddy
            export IMAGE_TAG=$IMAGE_TAG
            export GITHUB_REPOSITORY_OWNER=$GH_OWNER
            docker compose -f deploy/docker-compose.prod.yml pull backend
            docker compose -f deploy/docker-compose.prod.yml up -d backend caddy mongo
            docker system prune -f --filter "until=24h"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
