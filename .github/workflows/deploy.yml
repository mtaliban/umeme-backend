name: Deploy Backend → EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/umeme-backend

jobs:
  # ── CI: Build & push Docker image ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD: Deploy to EC2 via SSH ───────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE_TAG,GH_OWNER,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,JWT_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,SITE_URL,REVALIDATE_SECRET,FRONTEND_ORIGIN
          script: |
            set -e

            # Install Docker if not present
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            # Install docker compose plugin if not present
            if ! sudo docker compose version &>/dev/null 2>&1; then
              sudo apt-get install -y docker-compose-plugin
            fi

            # Login to GHCR
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Ensure /opt/company-website is owned by current user
            sudo mkdir -p /opt/company-website
            sudo chown -R $USER:$USER /opt/company-website

            # Clone or pull latest code
            if [ -d /opt/company-website/.git ]; then
              cd /opt/company-website && git pull origin main
            else
              git clone https://$GH_ACTOR:$GH_TOKEN@github.com/$GH_OWNER/umeme-backend.git /opt/company-website
              cd /opt/company-website
            fi

            cd /opt/company-website

            # Write .env file from secrets (using printf to avoid heredoc indentation issues)
            printf 'GITHUB_REPOSITORY_OWNER=%s\n' "$GH_OWNER" > deploy/.env
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> deploy/.env
            printf 'MONGO_ROOT_USERNAME=%s\n' "$MONGO_ROOT_USERNAME" >> deploy/.env
            printf 'MONGO_ROOT_PASSWORD=%s\n' "$MONGO_ROOT_PASSWORD" >> deploy/.env
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> deploy/.env
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL" >> deploy/.env
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> deploy/.env
            printf 'SITE_URL=%s\n' "$SITE_URL" >> deploy/.env
            printf 'REVALIDATE_SECRET=%s\n' "$REVALIDATE_SECRET" >> deploy/.env
            printf 'FRONTEND_ORIGIN=%s\n' "$FRONTEND_ORIGIN" >> deploy/.env

            # Pull new image and restart backend + caddy
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env pull backend
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v 2>/dev/null || true
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d backend caddy mongo || true

            # Show backend logs if unhealthy
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --tail=50 backend

            # Fail if backend is not running
            sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps backend | grep -q "running\|Up"

            sudo docker system prune -f --filter "until=24h"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
