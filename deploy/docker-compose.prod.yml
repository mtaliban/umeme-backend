x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/umeme-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-ummu_ayman}?authSource=admin
      - DB_NAME=${MONGO_DB:-ummu_ayman}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_DAYS=${JWT_DAYS:-90}
      - TZ_NAME=${TZ_NAME:-Africa/Dar_es_Salaam}
      - LOW_STOCK_THRESHOLD=${LOW_STOCK_THRESHOLD:-2}
      - CLOSE_DAY_REMINDER=${CLOSE_DAY_REMINDER:-21:00}
      - WEEKLY_REPORT_TIME=${WEEKLY_REPORT_TIME:-SUN 21:30}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
    logging: *default-logging

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
